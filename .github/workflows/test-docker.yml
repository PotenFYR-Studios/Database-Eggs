name: Test Docker & Database Engines

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push (or PR update) supersedes the in-flight run; earlier hung runs
# burned the full 6 h default before being cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-docker:
    name: Run Docker Integration Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image (GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: database-eggs:test
          cache-from: type=gha,scope=test-image
          cache-to: type=gha,scope=test-image,mode=max

      - name: Run Test Suite
        run: |
          chmod +x tests/test-docker.sh
          IMAGE_NAME="database-eggs:test" BUILD_IMAGE="0" ./tests/test-docker.sh

      - name: Redis source build (installer must not write /tmp)
        run: |
          chmod +x tests/test-source-engines.sh
          IMAGE_NAME="database-eggs:test" READY_TIMEOUT=1500 \
            ./tests/test-source-engines.sh redis 8.2.2 source

      - name: Upload source-build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-build-logs
          path: .cache/*.log
          if-no-files-found: ignore
          retention-days: 7

  panel-lifecycle:
    name: Panel Lifecycle Behavior Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Panel Lifecycle Suite
        run: |
          chmod +x tests/panel-test.sh
          ./tests/panel-test.sh
