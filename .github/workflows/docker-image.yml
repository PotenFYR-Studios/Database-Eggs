name: Build & Publish Universal Database Image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: potenfyr-studios/database-eggs

permissions:
  contents: read

jobs:
  # Per-architecture native builds. amd64 and arm64 run on native runners
  # (no QEMU - arm64 used to emulate for every push); the exotic arches
  # (arm/v7, s390x, ppc64le, riscv64) still emulate on a cached dedicated
  # leg each. Every leg pushes by digest with its own cache scope; the merge
  # job stitches the digests into one multi-arch manifest.
  build:
    name: Build image (${{ matrix.slug }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-latest
            qemu: "false"
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
            qemu: "false"
          - platform: linux/arm/v7
            slug: armv7
            runner: ubuntu-latest
            qemu: "true"
          - platform: linux/s390x
            slug: s390x
            runner: ubuntu-latest
            qemu: "true"
          - platform: linux/ppc64le
            slug: ppc64le
            runner: ubuntu-latest
            qemu: "true"
          - platform: linux/riscv64
            slug: riscv64
            runner: ubuntu-latest
            qemu: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU (emulated architectures only)
        if: matrix.qemu == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            RUNTIME_VARIANT=all
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=build-${{ matrix.slug }}
          cache-to: type=gha,scope=build-${{ matrix.slug }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-architecture digests into the published multi-arch tags.
  # latest + sha-<short> always; the git tag itself on v* builds.
  merge:
    name: Merge manifest & publish tags
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download per-arch digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags (single universal image)
        id: tags
        run: |
          set -euo pipefail
          IMAGE_URI="${REGISTRY}/${IMAGE_NAME}"
          TAGS="${IMAGE_URI}:latest,${IMAGE_URI}:sha-${GITHUB_SHA::7}"
          case "${GITHUB_REF}" in
            refs/tags/v*) TAGS="${TAGS},${IMAGE_URI}:${GITHUB_REF#refs/tags/}" ;;
          esac
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: Merge manifest lists and push tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          ARGS=""
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for t in "${TAG_LIST[@]}"; do ARGS="${ARGS} --tag ${t}"; done
          # shellcheck disable=SC2046
          docker buildx imagetools create ${ARGS} \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
          echo "Published multi-arch image:"
          docker buildx imagetools inspect "${TAG_LIST[0]}"

  registry-hygiene:
    name: Clean stale package versions
    needs: merge
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Remove old untagged container versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: database-eggs
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
